name: Real Integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-integration-${{ github.repository }}
  cancel-in-progress: false

jobs:
  integration:
    name: Run real integration tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RUN_FACTORY_BOOTSTRAP_INTEGRATION: "true"
      AI_FLUTTER_FACTORY_RUN_INTEGRATION: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        # subosito/flutter-action v2.23.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          git --version
          xcodebuild -version

      - name: Install dependencies
        run: dart pub get

      - name: Run real integration tests
        run: dart test --reporter expanded test/integration
